name: Update rates

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python rates_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Сохранить message_id.json обратно в репозиторий
        run: |
          git config user.email "actions@github.com"
          git config user.name "rates-bot"
          git add message_id.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
